name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Each step runs a recipe from the justfile, so `just ci` locally checks the
# same things.
jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@v4
      - name: Check formatting
        run: just fmt
      - name: Clippy
        run: just clippy
      - name: Test (including doctests)
        run: just test
      - name: Build documentation
        run: just doc
      - name: Run examples
        run: just examples

  loom:
    name: Loom model checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: extractions/setup-just@v4
      - name: Model-check concurrent updates
        run: just loom
      - name: Build and lint with --cfg loom
        run: just loom-lint

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Keep in step with rust-version in Cargo.toml, which `just msrv` reads.
      - uses: dtolnay/rust-toolchain@1.85
      - uses: extractions/setup-just@v4
      - name: Test
        run: just msrv
