name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test (including doctests)
        run: cargo test --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

  loom:
    name: Loom model checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Model-check concurrent updates
        env:
          RUSTFLAGS: --cfg loom
        run: cargo test --locked --release --lib
      # Projects that model-check their own code build their dependencies with
      # --cfg loom too, so the library has to build that way without loom.
      - name: Build and lint with --cfg loom
        env:
          RUSTFLAGS: --cfg loom
        run: |
          cargo check --locked --lib
          cargo clippy --locked --release --all-targets -- -D warnings

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85
      - name: Test
        run: cargo test --locked
