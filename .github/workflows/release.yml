name: Release

# Publishes the crate to crates.io when a version tag is pushed. It uses
# crates.io's trusted publishing: the publish job trades GitHub's
# short-lived identity token for a crates.io token that is revoked when the
# job ends, so no publishing token is stored anywhere.
#
# To release, merge a version bump (Cargo.toml and Cargo.lock) to main, then
# tag that commit and push the tag:
#
#   git tag -a v0.1.1 -m "in-progress 0.1.1" && git push origin v0.1.1

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  check:
    name: Check the tag and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All of history, to check that the tag is on main.
          fetch-depth: 0
      - name: Check the tag matches the version and is on main
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tag $GITHUB_REF_NAME isn't on main."
            exit 1
          fi
      - name: Test
        run: cargo test --locked

  # Any step in a job that may request an identity token could publish with
  # it, so this job runs nothing but the checkout, the token exchange and
  # cargo, and its actions are pinned to commits. The `release` environment
  # only accepts `v*` tags.
  publish:
    name: Publish to crates.io
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
