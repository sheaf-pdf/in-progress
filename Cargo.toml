[package]
name = "in-progress"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Progress reporting and cancellation for long-running operations"
repository = "https://github.com/sheaf-pdf/in-progress"
keywords = ["progress", "cancellation", "progress-bar", "cancel"]
categories = ["concurrency"]
# Only what users need, so local tooling files can't end up in the package.
include = ["/src", "/examples", "/README.md", "/LICENSE-*"]

[dependencies]

[dev-dependencies]
# For the rayon_pipeline example.
rayon = "1.12"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
